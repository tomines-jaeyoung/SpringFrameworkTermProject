<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="oa-main oa-narrow">
    <section class="oa-panel">
        <h1>회원가입</h1>
        <form th:action="@{/signup}" th:object="${form}" method="post" class="oa-form" novalidate>
            <p class="oa-flash oa-flash-err" th:if="${#fields.hasGlobalErrors()}" th:each="e : ${#fields.globalErrors()}" th:text="${e}" role="alert"></p>
            <label>아이디
                <input type="text" th:field="*{username}" autocomplete="username" maxlength="20" placeholder="영문 소문자·숫자·밑줄 4~20자">
                <span class="oa-err" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
            </label>
            <label>비밀번호
                <input type="password" th:field="*{password}" autocomplete="new-password" maxlength="64" placeholder="8자 이상">
                <span class="oa-err" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </label>
            <label>비밀번호 확인
                <input type="password" th:field="*{passwordConfirm}" autocomplete="new-password" maxlength="64">
                <span class="oa-err" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></span>
            </label>
            <label>이름(닉네임)
                <input type="text" th:field="*{name}" maxlength="20" placeholder="판매자·입찰자로 표시됩니다">
                <span class="oa-err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </label>
            <button type="submit" class="oa-btn oa-btn-coral oa-block">가입하기</button>
        </form>
        <p class="oa-sub">이미 회원이신가요? <a th:href="@{/login}">로그인</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
