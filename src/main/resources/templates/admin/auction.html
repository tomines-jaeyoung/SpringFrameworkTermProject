<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('경매 상세 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="oa-main">
    <div th:replace="~{admin/fragments :: top(${a.title}, '경매 정보와 입찰 기록 (timed_auctions · timed_bids)')}"></div>
    <section class="oa-panel oa-admin-detail">
        <img th:src="@{${a.image}}" th:alt="${a.title}">
        <div>
            <dl>
                <dt>판매자</dt><dd th:text="${a.seller}">-</dd>
                <dt>카테고리</dt><dd th:text="${a.category}">-</dd>
                <dt>시작가 / 현재가</dt><dd th:text="${@fmt.won(a.startPrice)} + ' / ' + ${@fmt.won(a.price)}">-</dd>
                <dt>기간</dt><dd th:text="${@fmt.dateTime(a.startsAt)} + ' ~ ' + ${@fmt.dateTime(a.endsAt)}">-</dd>
                <dt>상태</dt><dd><span class="oa-tag" th:classappend="${a.archived} ? 'oa-tag-red'" th:text="${a.status(@fmt.now())}">-</span></dd>
                <dt>영상</dt><dd th:text="${#strings.isEmpty(a.video)} ? '없음' : '있음'">-</dd>
                <dt>갱신 번호</dt><dd th:text="${a.revision}">0</dd>
            </dl>
            <div class="oa-actions">
                <form th:action="@{/admin/auctions/{id}/archive(id=${a.id})}" method="post">
                    <input type="hidden" name="back" th:value="@{/admin/auctions/{id}(id=${a.id})}">
                    <button type="submit" class="oa-btn oa-btn-sm" th:classappend="${a.archived} ? 'oa-btn-line' : 'oa-btn-danger'"
                            th:text="${a.archived} ? '다시 공개' : '숨기기'">숨기기</button>
                </form>
                <a class="oa-btn oa-btn-line oa-btn-sm" th:if="${!a.archived}" th:href="@{/auctions/{id}(id=${a.id})}">사이트에서 보기</a>
                <a class="oa-btn oa-btn-line oa-btn-sm" th:href="@{/admin/auctions}">목록으로</a>
            </div>
        </div>
    </section>
    <section class="oa-block-section oa-panel">
        <h2>입찰 기록 <small th:text="${#lists.size(bids)} + '건 (최근 30건)'"></small></h2>
        <div class="oa-table-wrap" th:if="${!#lists.isEmpty(bids)}">
        <table class="oa-table">
            <thead><tr><th>갱신 번호</th><th>입찰자</th><th>금액</th><th>시각</th></tr></thead>
            <tbody>
            <tr th:each="b : ${bids}">
                <td th:text="${b.revision}">0</td>
                <td th:text="${b.name}">-</td>
                <td th:text="${@fmt.won(b.amount)}">0원</td>
                <td th:text="${@fmt.dateTime(b.created)}">-</td>
            </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${#lists.isEmpty(bids)}" class="oa-sub">입찰 기록이 없습니다.</p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
