<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/layout :: head('관리 이력')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="oa-main">
    <div th:replace="~{admin/fragments :: top('관리 이력', 'admin_audit 테이블 · 관리자가 한 모든 변경을 누가·언제·무엇을 기준으로 기록합니다')}"></div>
    <section class="oa-panel">
        <p class="oa-sub" th:text="'전체 ' + ${page.totalElements} + '건'">전체 0건</p>
        <div class="oa-table-wrap" th:if="${page.totalElements > 0}">
        <table class="oa-table">
            <thead><tr><th>시각</th><th>관리자</th><th>작업</th><th>대상 ID</th><th>내용</th></tr></thead>
            <tbody>
            <tr th:each="l : ${page.content}">
                <td th:text="${@fmt.dateTime(l.created)}">-</td>
                <td th:text="${l.actorName}">admin</td>
                <td><span class="oa-tag" th:text="${l.actionLabel()}">작업</span></td>
                <td class="oa-mono" th:text="${#strings.length(l.target) > 12} ? ${#strings.substring(l.target,0,8)} + '…' : ${l.target}">id</td>
                <td th:text="${l.detail}">내용</td>
            </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${page.totalElements == 0}" class="oa-sub">아직 관리 이력이 없습니다.</p>
        <nav th:replace="~{admin/fragments :: pager('/admin/audit')}"></nav>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
