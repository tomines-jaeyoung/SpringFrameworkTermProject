# 실행: docker compose up -d --build   (접속 포트는 APP_PORT, 기본 8081)
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: onairmarket
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/onairmarket?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false"
      ONAIR_UPLOADDIR: /app/uploads
      SPRING_JPA_SHOWSQL: "false"
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  db-data:
  uploads:
